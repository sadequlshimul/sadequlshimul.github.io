:root{--ink:#fdf3e4;--mute:#b9a9c9;--gold:#ffc36b;--rose:#ff7aa2}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:#0b0818;color:var(--ink);font-family:'Hind Siliguri',sans-serif;font-size:17px;line-height:1.85;overflow-x:hidden}
.sky{position:relative;height:100svh;min-height:560px;overflow:hidden;background:linear-gradient(180deg,#0b0818 0%,#1b1038 45%,#4a1f4d 78%,#c4575a 100%);cursor:default}
.glow{position:absolute;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(255,195,107,.35),transparent 65%);pointer-events:none;transform:translate(-50%,-50%);left:50%;top:40%;transition:left .4s,top .4s}
.star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.15;transform:scale(.5)}}
.moon{position:absolute;right:12%;top:9%;width:62px;height:62px;border-radius:50%;background:#fff3d6;box-shadow:0 0 50px 12px rgba(255,230,170,.45),inset -14px -4px 0 0 #e8d3a6}
.hill{position:absolute;left:-5%;right:-5%;bottom:-2px;height:90px;background:#120a22;border-radius:50% 50% 0 0/100% 100% 0 0}
.head{position:absolute;left:0;right:0;top:20%;text-align:center;padding:0 22px;z-index:5;pointer-events:none}
.head small{letter-spacing:.2em;color:var(--gold);font-size:15px}
.head h1{font-family:'Noto Serif Bengali',serif;font-weight:800;font-size:clamp(38px,9.5vw,76px);line-height:1.3;margin:6px 0 12px;background:linear-gradient(100deg,#ffe0a8,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.head p{color:var(--mute);max-width:440px;margin:auto}
.hint{position:absolute;bottom:110px;left:0;right:0;text-align:center;color:var(--gold);font-size:15px;z-index:5;animation:pu 2.4s ease-in-out infinite}
@keyframes pu{50%{opacity:.4}}
.ln{position:absolute;bottom:-90px;width:34px;height:44px;border-radius:12px 12px 16px 16px;background:linear-gradient(180deg,#ffd58a,#ff8f5a);box-shadow:0 0 28px 8px rgba(255,170,90,.55);cursor:pointer;z-index:4;animation:up linear infinite;border:0}
.ln:before{content:"";position:absolute;left:50%;top:-8px;width:16px;height:8px;margin-left:-8px;background:#7a4a2a;border-radius:3px 3px 0 0}
.ln:after{content:"";position:absolute;left:50%;bottom:-14px;width:2px;height:14px;background:#ffc36b;opacity:.7}
@keyframes up{0%{transform:translate(0,0)}25%{transform:translate(22px,-30vh)}50%{transform:translate(-18px,-62vh)}75%{transform:translate(20px,-95vh)}100%{transform:translate(0,-130vh)}}
.ln.on{box-shadow:0 0 60px 24px rgba(255,200,110,.9);filter:brightness(1.25)}
#say{position:fixed;left:50%;bottom:9%;transform:translate(-50%,24px);background:#fff8ec;color:#4a3326;font-family:'Noto Serif Bengali',serif;padding:16px 26px;border-radius:14px;opacity:0;transition:.5s;z-index:50;max-width:88%;text-align:center;box-shadow:0 20px 50px -10px #000;pointer-events:none}
#say.s{opacity:1;transform:translate(-50%,0)}
