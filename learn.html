function prg(k){const p=PG[k];if(!p||(!p.att&&!p.wrong.length))return"";return`<div>${p.att?`<span class="chip2">সেরা স্কোর ${NB(p.best)}/১০</span>`:""}${p.best>=9?`<span class="chip2 ok">আয়ত্ত</span>`:""}${p.wrong.length?`<span class="chip2 no">ভুল ${NB(p.wrong.length)}</span>`:""}</div>`}
function bank(k){const t=TP[k],st=(t.quiz||[]).map(q=>({k:"m",p:q[0],h:q[1],a:q[2],o:sh(q[3]),w:q[4]}));return sh([...GEN[k](60),...st])}
function qstart(k,m){const p=pg(k);let it;if(m==="w")it=sh(p.wrong).slice(0,10);else it=bank(k).slice(0,10);if(!it.length){Q=null;return}Q={k,m,it,i:0,s:0,a:null,ch:[]};mkq()}
function mkq(){const q=Q.it[Q.i];Q.a=null;Q.ch=[];if(q.k==="o")Q.tl=sh(q.a.split(" ").map((w,i)=>i))}
const typed=q=>Q.m==="t"&&q.k==="m"&&!/\s/.test(q.a);
function ans(v){const q=Q.it[Q.i],ok=q.k==="o"?v===q.a:v.trim().toLowerCase()===q.a.toLowerCase();Q.a=v;Q.ok=ok;if(ok)Q.s++;
 const p=pg(Q.k),key=q.p+"|"+q.a;if(ok){if(Q.m==="w")p.wrong=p.wrong.filter(x=>x.p+"|"+x.a!==key)}else if(!p.wrong.some(x=>x.p+"|"+x.a===key)){p.wrong.push(q);p.wrong=p.wrong.slice(-40)}svp()}
function qview(t){const k=view,p=pg(k);
 if(!Q)return`<div class="box"><h3>অনুশীলন</h3><p class="hint">${p.att?`সেরা স্কোর: ${NB(p.best)}/১০ • চেষ্টা: ${NB(p.att)}বার`:"প্রতিবার ১০টা নতুন প্রশ্ন আসবে।"}</p><button class="big" data-qs="m">অপশন বেছে অনুশীলন</button><button class="big" data-qs="t" style="background:transparent;color:var(--tc);border:2px solid var(--tc)">লিখে উত্তর দিয়ে অনুশীলন</button>${p.wrong.length?`<button class="big" data-qs="w" style="background:var(--no)">ভুল প্রশ্ন আবার (${NB(p.wrong.length)}টি)</button>`:""}</div>`;
 const n=Q.it.length;
 if(Q.i>=n){const f=Q.s/n;return`<div class="box res"><h2>${NB(Q.s)} / ${NB(n)}</h2><p>${f>=.8?"দারুণ! ভালো বুঝেছ।":f>=.5?"ভালো হয়েছে। পাঠ অংশ আরেকবার দেখে আবার চেষ্টা করো।":"চিন্তা নেই। পাঠ অংশটা আবার পড়ে চেষ্টা করো।"}</p>${p.wrong.length?`<p class="hint">ভুল জমা আছে: ${NB(p.wrong.length)}টি</p>`:""}<button class="big" data-r="1">আবার অনুশীলন করুন</button></div>`}
 const q=Q.it[Q.i],a=Q.a!==null;let body="";
 if(q.k==="o"){const ws=q.a.split(" ");body=`<div class="chs">${Q.ch.map(i=>`<span class="tile used" style="opacity:1">${ws[i]}</span>`).join("")}</div><div class="tiles">${Q.tl.map(i=>`<button class="tile ${Q.ch.includes(i)?"used":""}" data-w="${i}" ${Q.ch.includes(i)||a?"disabled":""}>${ws[i]}</button>`).join("")}</div>${a?"":`<div class="seg" style="margin-top:12px"><button data-wc="1">মুছে দাও</button><button class="on" data-wk="1">যাচাই করো</button></div>`}`}
 else if(typed(q)){body=a?`<div class="chs">${Q.a||"—"}</div>`:`<input class="ti" id="ti" autocomplete="off" autocapitalize="off" placeholder="এখানে লেখো"><div class="um">${["ä","ö","ü","ß"].map(c=>`<button data-u="${c}">${c}</button>`).join("")}</div><button class="big" data-tk="1">যাচাই করো</button>`}
 else body=Q.it[Q.i].o.map(o=>`<button class="op ${a?(o===q.a?"ok":o===Q.a?"no":"dim"):""}" data-o="${o}" ${a?"disabled":""}>${o}</button>`).join("");
 let fb="";if(a)fb=Q.ok?`<div class="fb ok">${q.w}</div>`:`<div class="fb no">${q.k==="o"?"":`তুমি দিয়েছ <b>${Q.a||"—"}</b>${Q.a?" — "+exp(k,q,Q.a)+"।":"।"} `}সঠিক উত্তর: <b>${q.a}</b>। ${q.w}</div>`;
 return`<div class="box"><div class="qh"><span>প্রশ্ন ${NB(Q.i+1)} / ${NB(n)}${Q.m==="w"?" (ভুল প্রশ্ন)":""}</span><span>স্কোর: ${NB(Q.s)}</span></div><div class="qs">${q.p.replace("___","<i>&nbsp;&nbsp;&nbsp;</i>")}</div><div class="hint">বাংলা অর্থ: ${q.h}</div>${body}${fb}${a?`<button class="big" data-n="1">${Q.i+1>=n?"ফলাফল দেখুন":"পরের প্রশ্ন"}</button>`:""}</div>`}
function render(){
 const t=TP[view];document.documentElement.style.setProperty("--tc",t?t.col:"#0057a3");
 $("ts").textContent=view==="hub"?"📖 শেখার ঘর":view==="gram"?"📖 গ্রামার":t.ti;
 if(view==="hub"){$("tbody").innerHTML=`<p class="hint">কোন বিষয় শিখতে চাও? একটা বেছে নাও।</p>`;$("view").innerHTML=hub();return}
 if(view==="gram"){$("tbody").innerHTML=`<p class="hint">কোন ব্যাকরণ শিখতে চাও? একটা বেছে নাও।</p>`;$("view").innerHTML=glist();return}
 $("tbody").innerHTML=`<div class="seg"><button data-t="learn" class="${tab==="learn"?"on":""}">${bi("পাঠ")}</button><button data-t="quiz" class="${tab==="quiz"?"on":""}">${bi("অনুশীলন")}</button></div>`;
 $("view").innerHTML=tab==="learn"?lesson(t):qview(t)}
document.addEventListener("click",e=>{const b=e.target.closest("button,a");if(!b)return;const s=b.dataset;
 if(s.v){go(s.v);window.scrollTo(0,0);return}
 if(s.t){tab=s.t;Q=null;render();return}
 if(s.c){cs=s.c;render();return}
 if(s.s!==undefined){sg=+s.s;render();return}
 if(s.qs){qstart(view,s.qs);render();return}
 if(s.o!==undefined&&Q&&Q.a===null){ans(s.o);render();return}
 if(s.u){const i=$("ti");if(i){i.value+=s.u;i.focus()}return}
 if(s.tk&&Q&&Q.a===null){const i=$("ti");ans(i?i.value:"");render();return}
 if(s.w!==undefined&&Q&&Q.a===null){Q.ch.push(+s.w);render();return}
 if(s.wc){Q.ch.pop();render();return}
 if(s.wk&&Q&&Q.a===null){const ws=Q.it[Q.i].a.split(" ");ans(Q.ch.map(i=>ws[i]).join(" "));render();return}
 if(s.n){Q.i++;if(Q.i<Q.it.length)mkq();else if(Q.m!=="w"){const p=pg(view);p.att++;p.best=Math.max(p.best,Q.s);svp()}render();return}
 if(s.r){Q=null;render();return}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="ti"&&Q&&Q.a===null){ans(e.target.value);render()}});

["art","vrb","sat","pos"].forEach(k=>TP[k].segs.push({k:"m",l:"সাধারণ ভুল",b:[{t:"mis",l:MIS[k]}]}));
const PMIS={t:"mis",l:MIS.pro};
const DLG={"pro":[["A","Hallo! *Ich* bin Anna. Wie heißt *du*?","হ্যালো! আমি আন্না। তোমার নাম কী?"],["B","*Ich* heiße Tom. Kennst *du* Lisa?","আমি টম। তুমি কি লিসাকে চেনো?"],["A","Ja, *ich* kenne *sie* gut. *Sie* wohnt bei *mir*.","হ্যাঁ, আমি তাকে ভালো চিনি। সে আমার সাথে থাকে।"],["B","Dann besuche *ich* *euch* morgen.","তাহলে আমি কাল তোমাদের দেখতে যাব।"],["A","Super! *Ich* rufe *dich* an.","দারুণ! আমি তোমাকে ফোন করব।"]],"art":[["A","Was ist das?","এটা কী?"],["B","Das ist *ein* Tisch und das ist *eine* Lampe.","এটা একটা টেবিল আর এটা একটা বাতি।"],["A","Und das Buch hier? Gehört *das* Buch dir?","আর এই বইটা? বইটা কি তোমার?"],["B","Ja, ich brauche *das* Buch heute. Hast du *einen* Stuhl?","হ্যাঁ, আজ আমার বইটা দরকার। তোমার কি একটা চেয়ার আছে?"],["A","Nein, ich habe *keinen* Stuhl, aber ich habe *eine* Lampe.","না, আমার কোনো চেয়ার নেই, কিন্তু একটা বাতি আছে।"]],"vrb":[["A","Hallo Tom, was *machst* du?","হ্যালো টম, তুমি কী করছ?"],["B","Ich *lerne* Deutsch. *Lernst* du auch?","আমি জার্মান শিখছি। তুমিও কি শিখছ?"],["A","Ja, wir *lernen* zusammen. Anna *kommt* heute auch.","হ্যাঁ, আমরা একসাথে শিখি। আন্নাও আজ আসছে।"],["B","Super! Ich *rufe* sie gleich *an*.","দারুণ! আমি এক্ষুনি তাকে ফোন করছি।"],["A","Sie *hat* Zeit. Sie *ist* zu Hause.","তার সময় আছে। সে বাড়িতে আছে।"]],"sat":[["A","*Wie* *heißt* du?","তোমার নাম কী?"],["B","Ich *heiße* Ali. *Woher* *kommst* du?","আমি আলি। তুমি কোথা থেকে এসেছ?"],["A","Ich *komme* aus Indien. Und du?","আমি ভারত থেকে এসেছি। আর তুমি?"],["B","Ich *komme* aus Bangladesch. *Wo* *wohnst* du?","আমি বাংলাদেশ থেকে এসেছি। তুমি কোথায় থাকো?"],["A","Ich *wohne* in Berlin. *Lernst* du Deutsch?","আমি বার্লিনে থাকি। তুমি কি জার্মান শেখো?"],["B","Ja, heute *lerne* ich Deutsch.","হ্যাঁ, আজ আমি জার্মান শিখি।"]],"pos":[["A","Das ist *meine* Familie.","এটা আমার পরিবার।"],["B","Wer ist das? Ist das *dein* Vater?","ইনি কে? ইনি কি তোমার বাবা?"],["A","Ja, das ist *mein* Vater. *Seine* Frau heißt Sara, das ist *meine* Mutter.","হ্যাঁ, ইনি আমার বাবা। তাঁর স্ত্রীর নাম সারা, তিনি আমার মা।"],["B","Und wo wohnt *deine* Schwester?","আর তোমার বোন কোথায় থাকে?"],["A","Sie wohnt bei *meinen* Eltern. Ich besuche *meine* Schwester oft.","সে আমার বাবা-মায়ের সাথে থাকে। আমি আমার বোনকে প্রায়ই দেখতে যাই।"]]},SUM={"pro":["Nominativ (Wer? কে?): ich, du, er, sie, es, wir, ihr, sie, Sie","Akkusativ (Wen? কাকে?): mich, dich, ihn, sie, es, uns, euch, sie, Sie","Dativ (Wem? কার জন্য?): mir, dir, ihm, ihr, ihm, uns, euch, ihnen, Ihnen","<b>-ch</b> = Akkusativ (mich, dich)। <b>-r</b> = Dativ (mir, dir)","Dativ-ক্রিয়া: helfen, danken, gehören, gefallen, schmecken, passen, antworten","<b>sie</b> (ছোট হাতের) = সে বা তারা। <b>Sie</b> (বড় হাতের) = আপনি"],"art":["পুরুষবাচক <b class='der'>der</b>, স্ত্রীবাচক <b class='die'>die</b>, ক্লীব <b class='das'>das</b>, বহুবচন <b class='die'>die</b>","-ung, -heit, -keit, -schaft, -tion শেষে = <b class='die'>die</b>","-chen, -lein শেষে = <b class='das'>das</b>","সপ্তাহের দিন, মাস, ঋতু = <b class='der'>der</b>","ein/eine = একটা। kein/keine = কোনো … না","Akkusativ-এ শুধু পুরুষবাচক বদলায়: der → <b>den</b>, ein → <b>einen</b>, kein → <b>keinen</b>"],"vrb":["শেষাংশ: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en","Stamm শেষে -t বা -d: du arbeit<b>e</b>st, er arbeit<b>e</b>t","Stamm শেষে -s, -ß, -z: du heißt","sein: bin, bist, ist, sind, seid, sind","haben: habe, hast, hat, haben, habt, haben","স্বর বদলায় (du, er): fahren → fährst/fährt, lesen → liest, sehen → siehst/sieht, essen → isst, sprechen → sprichst/spricht","আলাদা হওয়া ক্রিয়া: Ich rufe dich <b>an</b>"],"sat":["সাধারণ বাক্যে ক্রিয়া <b>২য়</b> জায়গায়","অন্য কিছু ১ম জায়গায় এলে কর্তা ক্রিয়ার পরে: Heute lerne ich Deutsch","W-Frage: W-Wort + ক্রিয়া + কর্তা: Wo wohnst du?","Ja/Nein-Frage: ক্রিয়া <b>১ম</b> জায়গায়: Lernst du Deutsch?","W-Wort: Wer, Was, Wo, Woher, Wohin, Wann, Wie, Warum, Wie viel"],"pos":["mein (আমার), dein (তোমার), sein (তার, পুরুষ), ihr (তার, নারী), unser, euer, ihr (তাদের), Ihr (আপনার)","Nominativ: mein / meine / mein / meine","Akkusativ: <b>meinen</b> / meine / mein / meine","Dativ: <b>meinem / meiner / meinem / meinen</b>","euer → eure, euren, eurem, eurer","mit, bei, von, zu, nach, aus এর পরে সবসময় Dativ"]};
["art","vrb","sat","pos"].forEach(k=>{TP[k].segs.push({k:"d",l:"ছোট সংলাপ",b:[{t:"dlg",l:DLG[k]}]},{k:"s",l:"সারাংশ",b:[{t:"sum",l:SUM[k]}]})});
