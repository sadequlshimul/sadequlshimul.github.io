<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jabirs Weg</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0ea;--card:#fff;--ink:#0f1f3d;--mute:#7b8494;--line:#e6e2da;--pri:#0057a3;--hd:#0057a3;--yel:#ffdd1a;--ok:#1f9060;--no:#d6334f;--soft:#e1eaf3;--cN:#0057a3;--cA:#ea580c;--cD:#0891b2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--card:#13203a;--ink:#eef3fb;--mute:#9fb0c8;--line:#24365a;--soft:#1b2d4d;--pri:#5aaeff;--cN:#5aaeff;--cA:#fb923c;--cD:#22d3ee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1424;--card:#13203a;--ink:#eef3fb;--mute:#9fb0c8;--line:#24365a;--soft:#1b2d4d;--pri:#5aaeff;--cN:#5aaeff;--cA:#fb923c;--cD:#22d3ee;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Poppins,'Hind Siliguri',system-ui,sans-serif;font-size:15px;min-height:100vh}
.bn{font-family:'Hind Siliguri',Poppins,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.top{background:var(--card);border:2px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 10px 28px rgba(15,31,61,.08)}
.tb{position:relative;background:var(--hd);color:#fff;padding:18px 16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;overflow:hidden}
.tb::before,.tb::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.tb::before{width:200px;height:200px;left:-70px;top:-100px}.tb::after{width:170px;height:170px;right:-50px;bottom:-100px}
.tb>*{position:relative}
.badge{display:inline-block;background:var(--yel);color:#0f1f3d;font-weight:700;letter-spacing:.08em;font-size:13px;padding:7px 13px;border-radius:10px;font-family:Poppins,sans-serif}
.tsub{margin-top:9px;font-size:14px;opacity:.95}
#th{flex:none;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;font-size:17px}
.tbody{padding:14px;display:grid;gap:12px}
.crumb{display:flex;align-items:center;gap:10px}
.back{border:2px solid var(--pri);background:transparent;color:var(--pri);border-radius:12px;padding:7px 14px;font-weight:700}
h1{font-size:22px;margin:0}
.hint{color:var(--mute);font-size:14px;margin:0}
.hub{display:grid;gap:12px;margin-top:14px}
.hc{display:block;text-align:left;width:100%;background:var(--card);color:var(--ink);border:2px solid var(--line);border-left:6px solid var(--c);border-radius:20px;padding:18px 16px;text-decoration:none}
.hc h2{margin:0 0 6px;font-size:20px}
.hc p{margin:0 0 12px;color:var(--mute);font-size:15px;line-height:1.5}
.go{display:inline-block;background:var(--c);color:#fff;border-radius:12px;padding:8px 16px;font-weight:700;font-size:14px}
.tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--c);border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle;font-family:Poppins,sans-serif}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:80px;border:2px solid var(--c,var(--pri));background:transparent;color:var(--c,var(--pri));border-radius:14px;padding:10px 8px;font-weight:700;font-size:14px}
.seg button.on{background:var(--c,var(--hd));color:#fff}
.seg .cN{--c:var(--cN)}.seg .cA{--c:var(--cA)}.seg .cD{--c:var(--cD)}
.box{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-top:12px}
.box h3{margin:0 0 8px;font-size:17px}
.q{display:inline-block;font-weight:700;color:#fff;border-radius:8px;padding:2px 10px;margin-right:6px;font-family:Poppins,'Hind Siliguri',sans-serif}
.cN.q,.q.cN{background:var(--cN)}.q.cA{background:var(--cA)}.q.cD{background:var(--cD)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{padding:10px 4px;font-size:13px;color:#fff;text-align:center}
th.p{background:var(--hd)}th.cN{background:var(--cN)}th.cA{background:var(--cA)}th.cD{background:var(--cD)}
td{padding:9px 4px;border-top:1px solid var(--line);text-align:center;vertical-align:middle}
td b{display:block;font-size:17px}td small{display:block;color:var(--mute);font-size:12px;line-height:1.3}
td.p{background:var(--soft);font-weight:700}
tr.grp td{background:var(--soft);color:var(--pri);font-weight:700;font-size:12px;padding:5px;text-align:left}
td.cN b{color:var(--cN)}td.cA b{color:var(--cA)}td.cD b{color:var(--cD)}
.ex{padding:10px 0;border-top:1px solid var(--line)}.ex:first-of-type{border-top:0}
.ex .d{font-weight:600;font-size:17px}.ex .e{color:var(--mute);font-size:14px}.ex .b{color:var(--pri);font-size:16px}
.hl{color:#fff;background:var(--c);border-radius:6px;padding:0 6px}
ul{margin:6px 0 0;padding-left:20px;line-height:1.7}
.vb{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vb span{border:2px solid var(--c);color:var(--c);border-radius:10px;padding:3px 10px;font-weight:600;font-size:14px}
.tip{background:var(--soft);border-radius:14px;padding:12px;margin-top:12px;line-height:1.6}
.op{display:block;width:100%;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);font-size:19px;font-weight:700;margin-top:10px}
.op.ok{border-color:var(--ok);background:rgba(31,144,96,.15)}.op.no{border-color:var(--no);background:rgba(214,51,79,.15)}.op.dim{opacity:.5}
.big{margin-top:14px;width:100%;padding:14px;border:0;border-radius:14px;background:var(--hd);color:#fff;font-weight:700;font-size:15px}
.qh{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.qs{font-size:24px;font-weight:700;margin:14px 0 4px;line-height:1.4}
.qs i{font-style:normal;border-bottom:3px solid var(--pri);padding:0 14px;color:var(--pri)}
.fb{margin-top:12px;border-radius:14px;padding:12px;line-height:1.6}
.fb.ok{background:rgba(31,144,96,.15)}.fb.no{background:rgba(214,51,79,.15)}
.res{text-align:center;padding:10px 0}.res h2{font-size:34px;margin:6px 0}
@media (max-width:420px){td b{font-size:16px}th{font-size:12px}}

:root{--der:#1c7ed6;--die:#e03131;--das:#2f9e44;--tc:#0057a3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--der:#4dabf7;--die:#ff6b6b;--das:#51cf66}}
:root[data-theme="dark"]{--der:#4dabf7;--die:#ff6b6b;--das:#51cf66}
.der{color:var(--der)}.die{color:var(--die)}.das{color:var(--das)}
.th0{background:var(--tc)}
.m{display:block;font-weight:700;font-size:16px}
td.p{font-size:14px}
.hc{position:relative}
.hc .go{background:var(--c)}
.glist{display:grid;gap:12px;margin-top:14px}
.seg button{border-color:var(--c,var(--tc))}
.seg button.on{background:var(--c,var(--tc));border-color:var(--c,var(--tc))}
.seg button{color:var(--c,var(--tc))}.seg button.on{color:#fff}
.big{background:var(--tc)}
.qs i{border-color:var(--tc);color:var(--tc)}
.hl{background:var(--c,var(--tc))}
.mi{padding:10px 0;border-top:1px solid var(--line);line-height:1.7}.mi:first-of-type{border-top:0}.mi .e{color:var(--mute);font-size:14px}
.tg{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:6px;padding:1px 8px;margin-right:6px}.tg.no{background:var(--no)}.tg.ok{background:var(--ok)}
.chip2{display:inline-block;margin:0 6px 10px 0;font-size:12px;font-weight:700;border:2px solid var(--c);color:var(--c);border-radius:8px;padding:1px 8px}.chip2.ok{--c:var(--ok)}.chip2.no{--c:var(--no)}
.ti{width:100%;padding:13px;font-size:20px;border:2px solid var(--line);border-radius:14px;background:var(--bg);color:var(--ink);margin-top:10px;font-family:inherit}.ti:focus{outline:0;border-color:var(--tc)}
.um{display:flex;gap:8px;margin-top:8px}.um button{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px;font-size:18px;font-weight:700}
.tiles,.chs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chs{min-height:52px;border:2px dashed var(--line);border-radius:14px;padding:8px;font-size:19px;font-weight:700}
.tile{border:2px solid var(--tc);background:transparent;color:var(--tc);border-radius:10px;padding:8px 12px;font-weight:700;font-size:17px}.tile.used{opacity:.3;border-color:var(--line)}
.tile.used:not(button){background:var(--tc);color:#fff;opacity:1}
.dl{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.dl:first-of-type{border-top:0}.sp{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tc);color:#fff;display:grid;place-items:center;font-size:13px}.dl .d{font-weight:600;font-size:17px}.dl .b{color:var(--pri);font-size:15px}

/* ===== সাইটের সাথে মেলানো হিরো, কার্ড ও ফুটার ===== */
:root{--bg:#f4f1ea;--ink:#14213d;--mute:#6a7385;--line:#e3ded2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1625;--card:#16213a;--ink:#f1f4fa;--mute:#9aa6bf;--line:#2a3860}}
:root[data-theme="dark"]{--bg:#0e1625;--card:#16213a;--ink:#f1f4fa;--mute:#9aa6bf;--line:#2a3860}
body{font-family:'Hind Siliguri',system-ui,sans-serif;line-height:1.5}
.jh{background:var(--hd);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 56px;position:relative;text-align:center;overflow:hidden}
.jh:before,.jh:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.jh:before{width:200px;height:200px;left:-60px;top:-50px}.jh:after{width:160px;height:160px;right:-40px;bottom:-60px}
.jt{display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;min-height:38px}
.jb{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:99px;padding:6px 14px;font:600 13px 'Hind Siliguri',system-ui,sans-serif;min-height:38px}
.jt #th{position:static;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:17px;padding:0}
.jbr{display:inline-block;background:var(--yel);color:#0b2447;font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase;padding:2px 10px;border-radius:6px;position:relative;z-index:1;font-family:'Hind Siliguri',system-ui,sans-serif}
.jhi{font-size:22px;font-weight:600;margin:12px 0 2px;min-height:34px;position:relative;z-index:1}
.jst{height:6px;background:var(--yel)}
.wrap{max-width:520px;margin:-34px auto 0;padding:0 14px 20px;position:relative;z-index:2}
@media(min-width:600px){.wrap{max-width:680px}}
.top{background:var(--card);border:0;border-radius:16px;box-shadow:0 2px 10px rgba(0,30,70,.08)}
.tb{display:none}
.hc{border:0;border-left:8px solid var(--c);border-radius:16px;box-shadow:0 2px 10px rgba(0,30,70,.08)}
.hub{margin-top:14px}
footer{text-align:center;color:var(--mute);font-size:12px;padding:10px}
.fbi{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:50%;background:#1877f2;color:#fff;margin:4px 0 8px}
.fbw{display:flex;align-items:center;gap:10px;max-width:340px;margin:8px auto 10px;color:var(--ink);text-decoration:none;font-size:14px;font-weight:600}.fbl{flex:1;border-top:3px dashed var(--line)}.fbw .fbi{margin:0;flex:none}

.seg button{font-size:14px}
.seg button .g{display:block;font-weight:700;line-height:1.25}
.seg button small{display:block;font-size:11px;font-weight:500;opacity:.85;line-height:1.25;margin-top:1px}
/* ===== স্মুথ ===== */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
html{background:var(--bg);scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body,.card,.top,.tbody,footer,input{transition:background-color .25s ease,color .25s ease,border-color .25s ease}
button,a,.hc,.cc,.ht{transition:transform .15s ease,background-color .25s ease,color .25s ease,border-color .25s ease,opacity .2s ease,box-shadow .25s ease}
button:active,.hc:active,.cc:active,.ht:active{transform:scale(.97)}
@keyframes jwin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.jwa{animation:jwin .28s ease both}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.wrap,main{animation:jwin .35s ease both}
.jt{justify-content:flex-end}
</style>
<script>try{var _s=localStorage.getItem("th");if(_s)document.documentElement.setAttribute("data-theme",_s)}catch(e){}</script>

<div class="jst"></div>
