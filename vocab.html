<html lang="bn">
<head>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0ea;--card:#fff;--ink:#0f1f3d;--mute:#7b8494;--line:#e6e2da;--pri:#0057a3;--hd:#0057a3;--l1:#1f9060;--l2:#0057a3;--l3:#7c3aed;--yel:#ffdd1a;--ok:#1f9060;--no:#d6334f;--der:#1c7ed6;--die:#e03131;--das:#2f9e44;--soft:#e1eaf3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1424;--card:#13203a;--ink:#eef3fb;--mute:#9fb0c8;--line:#24365a;--soft:#1b2d4d;--pri:#5aaeff;--l2:#4da3ff;--der:#4dabf7;--die:#ff6b6b;--das:#51cf66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1424;--card:#13203a;--ink:#eef3fb;--mute:#9fb0c8;--line:#24365a;--soft:#1b2d4d;--pri:#5aaeff;--l2:#4da3ff;--der:#4dabf7;--die:#ff6b6b;--das:#51cf66;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Poppins,'Hind Siliguri',system-ui,sans-serif;min-height:100vh;font-size:15px}
.bn{font-family:'Hind Siliguri',Poppins,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px}
header{position:relative;background:var(--hd);color:#fff;border-radius:24px;padding:22px 20px;box-shadow:0 12px 32px rgba(0,87,163,.28);overflow:hidden}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 14px;opacity:.92;font-size:15px}
#th{position:absolute;top:16px;right:16px;border:0;background:rgba(255,255,255,.22);color:#fff;width:40px;height:40px;border-radius:50%;font-size:18px}
.levels{display:flex;gap:8px}
.lv{padding:7px 16px;border-radius:99px;font-weight:600;font-size:13px;border:1px solid rgba(255,255,255,.45)}
.lv.on{background:var(--yel);color:#0f1f3d;border-color:var(--yel)}.lv.soon{opacity:.6}.lv small{font-size:10px;font-weight:400}
.prog{margin-top:16px;font-size:14px;display:flex;justify-content:space-between}
.bar{height:10px;background:rgba(255,255,255,.28);border-radius:9px;margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--yel);border-radius:9px;transition:width .5s}
.tools{display:flex;gap:8px;margin:16px 0 10px}
.search{flex:1;min-width:0;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:3px}
.seg button{border:0;background:transparent;color:var(--mute);padding:8px 13px;border-radius:11px;font-weight:600;font-size:14px}
.seg button.on{background:var(--hd);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip,.tgb{white-space:nowrap;padding:8px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
.chip.on{background:var(--hd);border-color:var(--hd);color:#fff;font-weight:600}
#tg{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.tgb.on::before{content:"✓ "}
.tgb.on{background:var(--soft);border-color:var(--pri);color:var(--pri);font-weight:600}
.tw{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 6px 22px rgba(30,40,80,.07)}
table{width:100%;border-collapse:collapse}
th{position:sticky;top:env(safe-area-inset-top,0px);background:var(--hd);color:#fff;text-align:left;font-size:13px;padding:12px 10px;z-index:2}
td{padding:12px 10px;border-top:1px solid var(--line);font-size:15px;vertical-align:middle}
tr[data-o]{animation:fi .3s}
tr[data-o] td:first-child{border-left:5px solid var(--cc)}
tr[data-o]:hover td{background:var(--soft)}
tr.gh td{background:var(--cc);color:#fff;font-weight:700;font-size:14px;padding:9px 12px;border-top:0}
td.g{font-weight:700;font-size:19px;white-space:nowrap}
.der{color:var(--der)}.die{color:var(--die)}.das{color:var(--das)}
td.bt,.bt3{color:var(--pri);font-weight:600;font-size:17px}
td.ac{width:46px;text-align:center}
.ib{width:30px;height:30px;border:0;border-radius:9px;background:var(--soft);color:var(--pri);font-size:13px;margin-left:6px;vertical-align:middle}
.ck{width:32px;height:32px;border-radius:10px;border:2px solid var(--line);background:transparent;color:transparent;font-size:15px}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.pop{animation:pop .4s}
tr.ex td{background:var(--soft);border-top:0;padding:10px 14px 14px 18px;animation:fi .25s}
.de2{font-weight:600;font-size:16px}.en3{color:var(--mute);font-size:14px;margin:2px 0}
.bl{filter:blur(7px);user-select:none;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.qc{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;text-align:center;box-shadow:0 8px 24px rgba(30,40,80,.08)}
.qh{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin-bottom:14px}
.qw{font-size:36px;font-weight:700;margin-bottom:4px}
.ops{display:grid;gap:10px;margin-top:18px}
.op{padding:13px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);text-align:center}
.op span{display:block;font-size:19px;font-weight:600}.op small{color:var(--mute);font-size:12px}
.op.ok{border-color:var(--ok);background:rgba(22,163,74,.15)}.op.no{border-color:var(--no);background:rgba(225,29,72,.15)}.op.dim{opacity:.5}
.big{margin-top:16px;width:100%;padding:14px;border:0;border-radius:16px;background:var(--hd);color:#fff;font-weight:600;font-size:15px}
.res{font-size:52px}
.leg{display:flex;gap:14px;justify-content:center;font-size:12px;margin-top:12px}
.note{margin-top:14px;text-align:center;font-size:12px;color:var(--mute)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:440px){td{padding:11px 6px;font-size:14px}td.g{font-size:17px}td.bt{font-size:16px}th{padding:11px 6px}.ib{margin-left:3px;width:26px;height:26px}}
.lv.soon2{opacity:.6}
header::before,header::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
header::before{width:230px;height:230px;left:-80px;top:-100px}header::after{width:200px;height:200px;right:-70px;bottom:-110px}
header>*{position:relative}
.soon{opacity:.45;font-size:13px;font-weight:400}
.stat{color:var(--mute);font-size:13px;margin:2px 2px 8px}
.az{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.az .chip{padding:6px 12px;flex:none}
tr.r-der{--cc:var(--der)}tr.r-die{--cc:var(--die)}tr.r-das{--cc:var(--das)}tr.r-vb{--cc:#f2b705}tr.r-ot{--cc:#94a3b8}
tr.gh{scroll-margin-top:46px}tr.gh td{background:var(--hd);font-size:15px}
.qkb{margin-bottom:12px;justify-content:center}
.fm{display:block;font-size:12px;font-weight:400;color:var(--mute);margin-top:1px}
.fbtn{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:0 14px;font-size:14px;font-family:'Hind Siliguri',sans-serif;color:var(--ink)}
.filt{display:none}.filt.on{display:block}
.r-der{--cc:var(--der)}.r-die{--cc:var(--die)}.r-das{--cc:var(--das)}.r-vb{--cc:#f2b705}.r-ot{--cc:#94a3b8}
.cards{display:grid;gap:8px;padding:10px 0 4px}
.wc{display:grid;grid-template-columns:1fr 44px;gap:4px 8px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--cc);border-radius:16px;padding:12px 10px 12px 14px}
.wc>*{grid-column:1}
.wde{font-size:22px;line-height:1.25;color:var(--ink)}
.wde i{font-style:normal;font-size:13px;font-weight:600;margin-right:6px}
.wde.der,.wde.die,.wde.das{color:var(--cc)}
.wde .fm{font-size:12px;font-weight:400;color:var(--mute)}
.wm{display:flex;gap:8px;align-items:baseline;font-size:14px;color:var(--mute)}
.wm.bn{font-size:17px}
.lg{flex:none;font-size:10px;font-weight:700;background:var(--soft);color:var(--mute);border-radius:6px;padding:1px 6px;font-family:Poppins,sans-serif}
.wc .ck{grid-column:2;grid-row:1/4;align-self:center;justify-self:end}
.rail{padding-top:2px}
.stn{position:relative;padding-left:48px;margin-bottom:10px}
.stn::before{content:"";position:absolute;left:19px;top:0;bottom:-10px;width:6px;border-radius:3px;background:repeating-linear-gradient(180deg,var(--line) 0 7px,transparent 7px 12px)}
.stn.done::before{background:repeating-linear-gradient(180deg,var(--ok) 0 7px,transparent 7px 12px)}
.nd{position:absolute;left:8px;top:11px;width:28px;height:28px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:12px;color:var(--mute);z-index:1}
.stn.cur .nd{background:var(--yel);border-color:var(--yel);color:#0f1f3d}
.stn.done .nd{background:var(--ok);border-color:var(--ok);color:#fff}
.sh{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:12px 14px}
.stn.open .sh{border-color:var(--hd);box-shadow:0 4px 14px rgba(0,87,163,.15)}
.sl{flex:1}.sl b{font-size:16px}.sl small{display:block;color:var(--mute);font-size:12px;font-family:Poppins,sans-serif}
.sp{font-size:12px;font-weight:700;background:var(--soft);color:var(--pri);border-radius:99px;padding:4px 11px}
button.lv{background:transparent;color:#fff;font:inherit;font-weight:600;font-size:13px;cursor:pointer}
button.lv.on{background:var(--yel);color:#0f1f3d;border-color:var(--yel)}
.tabs{display:flex;gap:6px;margin:14px 0 2px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);padding:10px 4px;border-radius:14px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--hd);color:#fff}
.lh{font-weight:700;font-size:16px;color:var(--pri);padding:8px 4px 0;scroll-margin-top:8px}
.stn.lock .sh{opacity:.55}.stn.lock .nd{font-size:10px}
.fcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:34px 16px;margin:12px 0;text-align:center;cursor:pointer;min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.fw{font-size:34px;font-weight:700}.fe{font-size:20px;color:var(--mute);margin-top:12px}.fb{font-size:27px;font-weight:600;color:var(--pri)}
.hint{font-size:13px;color:var(--mute);margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ghost{margin-top:10px;width:100%;padding:12px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.lb{font-size:11px;font-weight:700;background:var(--soft);color:var(--pri);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:middle;font-family:Poppins,sans-serif}
.lvrow{display:flex;gap:8px;align-items:stretch;margin:14px 0 0}
.lvb{flex:1;border:2px solid var(--c);background:transparent;color:color-mix(in srgb,var(--c) 75%,var(--ink));border-radius:14px;padding:10px 6px;font-weight:700;font-size:15px;font-family:Poppins,sans-serif;line-height:1.1;cursor:pointer}

.lvb.l1{--c:var(--l1);--t:#fff}.lvb.l2{--c:var(--l2);--t:#fff}.lvb.l3{--c:var(--l3);--t:#fff}
.lvb.all{--c:var(--ink);--t:var(--bg);flex:0 0 64px}
.lvb.on{background:var(--c);color:var(--t)}
.vd{width:2px;background:var(--line);border-radius:2px;margin:4px 2px}
.lb.l1{background:var(--l1);color:#fff}.lb.l2{background:var(--l2);color:#fff}.lb.l3{background:var(--l3);color:#fff}
/* unified box style */
.tabs{background:none;border:0;padding:0;gap:8px}
.tabs button{border:2px solid var(--pri);background:transparent;color:var(--pri);border-radius:14px;padding:11px 4px;font-weight:700}
.tabs button.on{background:var(--hd);border-color:var(--hd);color:#fff}
.search{border:2px solid var(--line);border-radius:14px}.search:focus{outline:0;border-color:var(--pri)}
.fbtn{border:2px solid var(--pri);color:var(--pri);border-radius:14px;font-weight:700;background:transparent}
.fbtn.on{background:var(--hd);border-color:var(--hd);color:#fff}
.chip{--c:var(--ink);--t:var(--bg);border:2px solid var(--c);background:transparent;color:color-mix(in srgb,var(--c) 80%,var(--ink));border-radius:12px;font-weight:700;padding:7px 14px;font-family:Poppins,'Hind Siliguri',sans-serif}

.chip[data-c="N"]{--c:var(--der);--t:#fff}.chip[data-c="V"]{--c:#f2b705;--t:#0f1f3d}.chip[data-c="ADJ"]{--c:#ea580c;--t:#fff}.chip[data-c="ADV"]{--c:#0891b2;--t:#fff}.chip[data-c="O"]{--c:#64748b;--t:#fff}
.tgb{border:2px solid var(--pri);background:transparent;color:var(--pri);border-radius:12px;font-weight:700;padding:8px 14px}

.seg{background:none;border:0;padding:0;gap:8px;display:flex}

.stat{background:var(--soft);border-radius:12px;padding:8px 12px;color:var(--ink);font-weight:600}
.sh{border:2px solid var(--line)}
.stn.done .sh{border-color:var(--ok)}.stn.cur .sh{border-color:var(--yel)}.stn.open .sh{border-color:var(--hd)}.stn.lock .sh{border-style:dashed}
.wc{border:2px solid var(--line);border-left:5px solid var(--cc)}
.fcard,.qc{border:2px solid var(--line)}
.ghost{border:2px solid var(--pri);color:var(--pri);background:transparent}
/* hero + progress card */
header{text-align:center;padding:28px 18px 62px;background:var(--hd)}

/* ===== স্মুথ ===== */
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s}
html{background:var(--bg);scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body,.card,.top,.tbody,footer,input{transition:background-color .25s ease,color .25s ease,border-color .25s ease}
button,a,.hc,.cc,.ht{transition:transform .15s ease,background-color .25s ease,color .25s ease,border-color .25s ease,opacity .2s ease,box-shadow .25s ease}
button:active,.hc:active,.cc:active,.ht:active{transform:scale(.97)}
@keyframes jwin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.jwa{animation:jwin .28s ease both}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.wrap,main{animation:jwin .35s ease both}
.jt{justify-content:flex-end}
