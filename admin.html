<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>চিঠির বাক্স</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600&family=Noto+Serif+Bengali:wght@500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}body{background:#0b0818;color:#fdf3e4;font-family:'Hind Siliguri',sans-serif;line-height:1.8;padding:24px 16px}
.w{max-width:680px;margin:auto}h1{font-family:'Noto Serif Bengali',serif;font-size:28px;margin-bottom:16px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ffffff30;background:#ffffff10;color:inherit;font:inherit;margin-bottom:10px}
button{font:inherit;font-weight:600;padding:8px 18px;border-radius:30px;border:0;cursor:pointer;background:linear-gradient(90deg,#ffd58a,#ff9db8);color:#2a1330}
button.g{background:#ffffff14;color:#fdf3e4;border:1px solid #ffffff30}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.c{background:#fff8ec;color:#4a3326;border-radius:12px;padding:16px 18px;margin-bottom:14px;font-family:'Noto Serif Bengali',serif;box-shadow:0 14px 30px -18px #000}
.c.n{border-left:6px solid #ff7aa2}.c p{white-space:pre-wrap;word-break:break-word;margin:6px 0 10px}
.c small{color:#a07a5c;font-family:'Hind Siliguri'}.c .b{display:flex;gap:8px}.c button{padding:4px 14px;font-size:14px}
#e{color:#ff9db8;margin-top:6px}
</style></head><body><div class="w">
<h1>💌 চিঠির বাক্স</h1>
<div id="lg"><input id="em" type="email" placeholder="অ্যাডমিন ইমেইল"><input id="pw" type="password" placeholder="পাসওয়ার্ড"><button id="in">ঢুকুন</button><div id="e"></div></div>
<div id="ap" style="display:none"><div class="top"><button class="g" id="f">শুধু অপঠিত</button><button class="g" id="r">রিফ্রেশ</button><button class="g" id="o">বের হন</button><span id="ct"></span></div><div id="ls"></div></div>
</div>
<script>
var U='YOUR-SUPABASE-URL',K='YOUR-ANON-KEY',tok=sessionStorage.getItem('t'),all=[],only=false,$=function(i){return document.getElementById(i)};
function H(){return{apikey:K,Authorization:'Bearer '+tok,'Content-Type':'application/json'}}
function bn(n){return n.toLocaleString('bn-BD',{useGrouping:false})}
async function login(){$('e').textContent='';try{var r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('em').value,password:$('pw').value})}),j=await r.json();if(!r.ok)throw 0;tok=j.access_token;sessionStorage.setItem('t',tok);load()}catch(x){$('e').textContent='ইমেইল বা পাসওয়ার্ড ভুল।'}}
function out(){sessionStorage.removeItem('t');tok=null;$('ap').style.display='none';$('lg').style.display='block'}
async function load(){var r=await fetch(U+'/rest/v1/letters?select=*&order=created_at.desc',{headers:H()});if(r.status==401){out();return}all=await r.json();$('lg').style.display='none';$('ap').style.display='block';draw()}
function draw(){var L=$('ls');L.textContent='';var list=all.filter(function(x){return!only||!x.is_read});$('ct').textContent=bn(all.filter(function(x){return!x.is_read}).length)+'টি অপঠিত';
if(!list.length){L.textContent='কোনো চিঠি নেই।';return}
list.forEach(function(x){var c=document.createElement('div');c.className='c'+(x.is_read?'':' n');
var s=document.createElement('small');s.textContent=(x.pen_name||'নামহীন')+' · '+new Date(x.created_at).toLocaleString('bn-BD');
var p=document.createElement('p');p.textContent=x.body;var b=document.createElement('div');b.className='b';
var a=document.createElement('button');a.textContent=x.is_read?'অপঠিত করুন':'পড়া হয়েছে';a.onclick=async function(){await fetch(U+'/rest/v1/letters?id=eq.'+x.id,{method:'PATCH',headers:H(),body:JSON.stringify({is_read:!x.is_read})});x.is_read=!x.is_read;draw()};
var d=document.createElement('button');d.className='g';d.style.color='#a42a33';d.textContent='মুছুন';d.onclick=async function(){if(!confirm('চিঠিটা চিরতরে মুছবেন?'))return;await fetch(U+'/rest/v1/letters?id=eq.'+x.id,{method:'DELETE',headers:H()});all=all.filter(function(y){return y.id!==x.id});draw()};
b.append(a,d);c.append(s,p,b);L.appendChild(c)})}
$('in').onclick=login;$('pw').onkeydown=function(e){if(e.key=='Enter')login()};$('r').onclick=load;$('o').onclick=out;
$('f').onclick=function(){only=!only;this.textContent=only?'সব দেখুন':'শুধু অপঠিত';draw()};
if(tok)load();
</script></body></html>
